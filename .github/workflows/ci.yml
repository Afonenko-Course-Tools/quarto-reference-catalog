name: Проверка Quarto и исполняемых TS-контрактов

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверка (${{ matrix.quarto }})
    runs-on: ubuntu-latest
    env:
      PERFORMANCE: ${{ github.workspace }}/.ci/performance
      COURSE_PERFORMANCE_SOURCE: ${{ github.workspace }}/.ci/performance
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        quarto: ["1.11.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Подготовить доступный кеш Quarto
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/course-qrc-cache
          LUA_LANGUAGE_SERVER: ${{ runner.temp }}/course-qrc-luals/bin/lua-language-server
        run: |
          mkdir -p -- "$XDG_CACHE_HOME"
          test -w "$XDG_CACHE_HOME"
          printf 'XDG_CACHE_HOME=%s\n' "$XDG_CACHE_HOME" >> "$GITHUB_ENV"
          printf 'LUA_LANGUAGE_SERVER=%s\n' "$LUA_LANGUAGE_SERVER" >> "$GITHUB_ENV"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.14
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ matrix.quarto }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course-performance
          ref: bfbe23f819dfe4c7d5e5487f669c14d8e6c9846e
          path: .ci/performance
          persist-credentials: false
      - name: Проверить закреплённый Performance и установить LuaLS
        run: |
          test "$(git -C "$PERFORMANCE" rev-parse HEAD)" = "bfbe23f819dfe4c7d5e5487f669c14d8e6c9846e"
          bash "$PERFORMANCE/tools/setup-mv-ci.sh" "$RUNNER_TEMP/course-gnu-mv" >> "$GITHUB_PATH"
          bash "$PERFORMANCE/tools/setup-lua-ci.sh" "$RUNNER_TEMP/course-qrc-luals"
      - name: Установить закреплённый ShellCheck
        run: |
          tool_dir="$RUNNER_TEMP/shellcheck-0.11.0"
          mkdir -- "$tool_dir"
          curl --fail --location --silent --show-error \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$tool_dir/archive.tar.xz"
          printf '%s  %s\n' 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 "$tool_dir/archive.tar.xz" | sha256sum --check --status
          tar -xJf "$tool_dir/archive.tar.xz" --directory "$tool_dir" --strip-components=1
          "$tool_dir/shellcheck" --version
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course
          ref: 5c2b551724471ff7637aad1068f22c5f7998a687 # Core 9.0.0: exact source candidate
          path: .ci/course-core
          persist-credentials: false
      - name: Проверить закреплённый Core
        run: test "$(git -C .ci/course-core rev-parse HEAD)" = "5c2b551724471ff7637aad1068f22c5f7998a687"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-project-publish
          ref: 63d6922074b1345a83f93449cd5a9fe9fbfeaab3 # Site 5.2.0: production-stable companion, independent review/release pending
          path: .ci/course-site
          persist-credentials: false
      - name: Проверить закреплённый Site
        run: test "$(git -C .ci/course-site rev-parse HEAD)" = "63d6922074b1345a83f93449cd5a9fe9fbfeaab3"
      - name: Строгая проверка собственного Lua
        run: quarto run tools/check-types.ts --lua
      - name: ShellCheck и синтаксис каждого собственного shell-файла
        run: |
          quarto run tools/check-types.ts --shell
          for script in \
            tests/fixtures/inspect-only.sh \
            tests/fixtures/native-refusal.sh \
            tests/fixtures/ok-tool.sh \
            tests/fixtures/print-env.sh \
            tests/fixtures/process-tool.sh; do
            bash -n "$script"
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Установить зависимости статических проверок
        run: npm ci --ignore-scripts
      - name: Полный production quality и отрицательные контроли
        env:
          CORE: ${{ github.workspace }}/.ci/course-core
        run: |
          npm run check-quality
          npm run check-quality:controls
      - name: Строгие типы исходников, инструментов и проверок
        run: |
          quarto run tools/generate-parse5-types.ts --check
          quarto run tools/check-types.ts --typescript
          quarto run tools/check-types.ts --browser
          npm run check:node
      - name: Согласованность guard outputs и публичных типов
        run: quarto run tests/contract-consistency.ts
      - name: Детерминированная сериализация QRC
        run: |
          quarto run tests/metadata-order.ts
          quarto pandoc --lua-filter tests/metadata-order.lua --to plain < /dev/null
      - name: Путь к native композиции
        run: |
          echo "COURSE_SITE_REPO=$GITHUB_WORKSPACE/.ci/course-site" >> "$GITHUB_ENV"
          echo "CORE=$GITHUB_WORKSPACE/.ci/course-core" >> "$GITHUB_ENV"
      - name: Версии инструментов
        run: |
          quarto --version
      - name: Проверка режима off и контекста ABI 1
        run: |
          quarto run tests/performance.ts
          quarto run tests/performance-context.ts
          quarto run tests/performance-noenv.ts
          quarto run tests/performance-document-context.ts
          COURSE_PERF_MODE=summary quarto pandoc --lua-filter tests/performance-filter-context.lua --to plain < /dev/null
          quarto run tests/performance-native-context.ts
      - name: Источники каталогов и оформление ссылок
        run: |
          quarto run tests/demo-external.ts
          quarto run tests/diagnostics.ts
          quarto run tests/html-boundaries.ts
          quarto run tests/post-inspection.ts
          quarto run tests/export-context.ts
          quarto run tests/body-links.ts
          quarto run tests/condition-links.ts
          quarto run tests/native-source-addresses.ts
          quarto run tests/local-linking.ts
          quarto run tests/local-outputs.ts
          quarto run tests/local-imports.ts
          quarto run tests/native-local.ts
          quarto run tests/full-outputs.ts
          quarto run tests/search-publication.ts
          quarto run tests/profile-publication.ts
          quarto run tests/boundaries.ts
          quarto run tests/process-trace.ts
          quarto run tests/search.ts
          quarto run tests/publication-scan.ts
          quarto run tests/import-safety.ts
          quarto run tests/imports.ts
          quarto run tests/link-styles.ts
          quarto run tests/exports.ts
          quarto run tests/portal.ts
          quarto run tests/portal-configured.ts
      - name: Независимые публикации с импортом по HTTP
        run: quarto run tests/external.ts
      - name: Навигация к целям в HTML
        run: quarto run tests/navigation.ts
      - name: Профили составного проекта
        run: quarto run tests/composition.ts
      - name: Сборка примера и проверка каталога TS
        run: quarto run tests/example.ts
      - name: Установка браузерных зависимостей
        run: |
          npx playwright install --with-deps chromium
      - name: Раскрытие HTML-блоков и фрагментов Revealjs
        run: npm run test:browser
