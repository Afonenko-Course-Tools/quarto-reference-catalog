name: Проверка Quarto и CUE

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверка (${{ matrix.quarto }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        quarto: ["1.11.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ matrix.quarto }}
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: v0.17.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-project-publish
          ref: 9a23c6ba30f0fda27eee8ae7c39e8ac2796fbdfd # Site 5.1.4: точный кандидат
          path: .ci/course-site
          persist-credentials: false
      - name: Проверить закреплённый Site
        run: test "$(git -C .ci/course-site rev-parse HEAD)" = "9a23c6ba30f0fda27eee8ae7c39e8ac2796fbdfd"
      - name: Детерминированная сериализация QRC
        run: |
          quarto run tests/metadata-order.ts
          quarto pandoc --lua-filter tests/metadata-order.lua --to plain < /dev/null
      - name: Путь к native композиции
        run: echo "COURSE_SITE_REPO=$GITHUB_WORKSPACE/.ci/course-site" >> "$GITHUB_ENV"
      - name: Версии инструментов
        run: |
          quarto --version
          cue version
      - name: Проверка режима off и контекста ABI 1
        run: |
          quarto run tests/performance.ts
          quarto run tests/performance-context.ts
          quarto run tests/performance-noenv.ts
          quarto run tests/performance-document-context.ts
          COURSE_PERF_MODE=summary quarto pandoc --lua-filter tests/performance-filter-context.lua --to plain < /dev/null
          quarto run tests/performance-native-context.ts
      - name: Источники каталогов и оформление ссылок
        run: |
          quarto run tests/demo-external.ts
          quarto run tests/diagnostics.ts
          quarto run tests/export-context.ts
          quarto run tests/body-links.ts
          quarto run tests/local-linking.ts
          quarto run tests/local-outputs.ts
          quarto run tests/local-imports.ts
          quarto run tests/native-local.ts
          quarto run tests/full-outputs.ts
          quarto run tests/search-publication.ts
          quarto run tests/profile-publication.ts
          quarto run tests/boundaries.ts
          quarto run tests/process-trace.ts
          quarto run tests/search.ts
          quarto run tests/publication-scan.ts
          quarto run tests/import-safety.ts
          quarto run tests/imports.ts
          quarto run tests/link-styles.ts
          quarto run tests/exports.ts
          quarto run tests/portal.ts
          quarto run tests/portal-configured.ts
      - name: Независимые публикации с импортом по HTTP
        run: quarto run tests/external.ts
      - name: Навигация к целям в HTML
        run: quarto run tests/navigation.ts
      - name: Профили составного проекта
        run: quarto run tests/composition.ts
      - name: Сборка примера и проверка каталога CUE
        run: quarto run tests/example.ts
      - name: Установка браузерных зависимостей
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Раскрытие HTML-блоков и фрагментов Revealjs
        run: npm run test:browser
